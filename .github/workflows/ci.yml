name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc clang git meson ninja-build pkgconf-pkg-config gettext \
            gtk4-devel libadwaita-devel vte291-gtk4-devel \
            libepoxy-devel cairo-devel glib2-devel

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: meson setup build -Dtests=enabled --werror

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs
